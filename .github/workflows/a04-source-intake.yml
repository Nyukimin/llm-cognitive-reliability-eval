name: A04 pinned public source intake
on:
  push:
    branches: [work/a04-pinned-source-intake]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install parquet reader
        run: python -m pip install --disable-pip-version-check pyarrow==17.0.0
      - name: Fetch pinned public data and print one review record
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, io, json, urllib.request
          import pyarrow.parquet as pq
          revision = '670fd81f270314d0f8f82b34fcfe2187fd28f699'
          url = f'https://huggingface.co/datasets/ScaleAI/MultiChallenge/resolve/{revision}/data/test-00000-of-00001.parquet'
          with urllib.request.urlopen(url, timeout=60) as response:
              data = response.read(20000001)
          if len(data) > 20000000:
              raise RuntimeError('Oversized data')
          digest = hashlib.sha256(data).hexdigest()
          expected = '2711646aba61f814823297714aaf757e3a1b71c66c501402231de48490650515'
          if digest != expected:
              raise RuntimeError(f'Source hash mismatch: {digest}')
          rows = pq.read_table(io.BytesIO(data)).to_pylist()
          selected = [r for r in rows if r['question_id'] == '67455268bc2ba9e69b8618f8']
          if len(rows) != 266 or len(selected) != 1:
              raise RuntimeError('Unexpected dataset shape')
          print('BEGIN_A04_INTAKE_JSON')
          print(json.dumps({'source_url': url, 'source_sha256': digest, 'source_bytes': len(data), 'row_count': len(rows), 'record': selected[0], 'attribution': 'ScaleAI/MultiChallenge', 'license': 'CC-BY-4.0', 'license_url': 'https://creativecommons.org/licenses/by/4.0/', 'model_runs': 0}, ensure_ascii=False))
          print('END_A04_INTAKE_JSON')
          PY
